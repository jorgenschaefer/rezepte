schema_version: "1.0"
name: nur-das-ueberarbeitete-rezept
description: >
  Der Skill schickt das fertige Rezept zur Prüfung und arbeitet die Befunde
  ein. Dabei gab er das Rezept zweimal aus – einmal vor dem Prüfer und danach
  überarbeitet noch einmal. Wer kocht, hat dann zwei Fassungen untereinander
  und muss raten, welche gilt. Der Grader hier stellt nur sicher, dass geprüft
  wurde; gezählt wird im Verlauf, mit evals/pruefe-ein-rezept.mjs – ein Grader
  sieht nur die Endantwort und damit immer genau ein Rezept.
tags: [format]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
runs: 5
graders:
  - type: tool_used
    name: pruefer-gelaufen
    weight: 1
    tool: Agent
    min: 1
