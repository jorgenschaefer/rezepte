schema_version: "1.0"
name: nur-das-ueberarbeitete-rezept
description: >
  Der Skill schickt das fertige Rezept zur Prüfung und arbeitet die Befunde
  ein. Dabei gab er das Rezept zweimal aus – einmal vor dem Prüfer und danach
  überarbeitet noch einmal. Wer kocht, hat dann zwei Fassungen untereinander
  und muss raten, welche gilt. Der Grader hier stellt nur sicher, dass geprüft
  wurde; gezählt wird im Verlauf, mit evals/pruefe-ein-rezept.mjs – ein Grader
  sieht nur die Endantwort und damit immer genau ein Rezept.
  Der Fall deckt nur den synchronen Weg ab: Im Harness blockiert der
  Agent-Aufruf, und zwischen Aufruf und Befund passt kein Entwurf. Gefallen ist
  das doppelte Rezept in der interaktiven Sitzung, wo der Prüfer im Hintergrund
  startet; dafür liest dasselbe Skript einen Sitzungsverlauf direkt. Die Regel
  steht im „Bevor du es ausgibst" der Prüfzeile – derselben Zeile, an der
  pruefung-vor-der-ausgabe hängt. Siehe evals/README.md, „Ein Rezept, nicht
  zwei".
tags: [format]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
runs: 5
graders:
  - type: tool_used
    name: pruefer-gelaufen
    weight: 1
    tool: Agent
    min: 1
