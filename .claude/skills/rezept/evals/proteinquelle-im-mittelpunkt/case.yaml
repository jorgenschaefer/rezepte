schema_version: "1.0"
name: proteinquelle-im-mittelpunkt
description: >
  Absicherung, kein Beleg: Ein Rezept, das eine Proteinquelle zieht, baut auch
  ohne eigene Zeile darauf auf. Der Fall schlägt an, wenn die gezogene Quelle
  zum Beiwerk verkommt.
tags: [vorrat]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: llm
    name: proteinquelle-traegt-das-gericht
    weight: 1
    criteria: |
      Die Antwort nennt eine Proteinquelle aus dem Vorrat – Tofu, Lachs,
      Soja-Schnetzel, Linsen, Bohnen, Eier, Quark, Käse oder ähnlich.

      Bestanden, wenn diese Proteinquelle das Gericht trägt: Sie liefert den
      größten Proteinanteil der Zutatenliste und prägt das Gericht erkennbar,
      etwa im Titel oder als Hauptkomponente.

      Durchgefallen, wenn die genannte Proteinquelle nur Beiwerk ist – eine
      Streumenge, ein Topping, eine Zutat unter vielen –, oder wenn eine andere
      Zutat das Gericht offensichtlich trägt.
