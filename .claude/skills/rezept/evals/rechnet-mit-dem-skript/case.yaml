schema_version: "1.0"
name: rechnet-mit-dem-skript
description: >
  Absicherung, kein Beleg: Das Modell findet scripts/naehrwerte.mjs im
  Skillordner von selbst. Der Fall schlägt an, wenn wieder im Kopf addiert
  wird – die Tabelle ist Arithmetik über acht Zutaten, und von Hand geht sie
  irgendwann schief.
tags: [naehrwerte]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: tool_used
    name: skript-gelaufen
    weight: 1
    tool: Bash
    input_match: naehrwerte
    min: 1
