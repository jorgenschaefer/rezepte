schema_version: "1.0"
name: standardkalorien
description: >
  Belegt die Zeile „Das Rezept sollte ungefähr 600 kcal erreichen". Der
  Aufruf nennt keine Zahl. Ohne die Zeile sucht sich das Modell ein eigenes
  Ziel (1 von 3 Läufen im Korridor), mit ihr als einziger Zeile wieder 3 von 3.

  Die Zeile hieß früher „Wurde keine Kalorienzahl angegeben, nimm 600 kcal"
  und stand hinten bei den Sonderfällen; jetzt steht sie als Ziel oben und
  ohne Bedingung. Nachgemessen, weil eine unbedingte 600 die Zahl aus dem
  Auftrag hätte überschreiben können: `vorratskammer-regeln` mit
  „/rezept 450 kcal mit Lachs" landete bei 450, 444 und 450 kcal. Die
  gewünschte Zahl gewinnt, die 600 greift nur ohne Angabe.
tags: [naehrwerte]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: regex
    name: energie-im-korridor-um-600
    weight: 1
    pattern: "Energie\\s*\\|\\s*(5[7-9][0-9]|6[0-2][0-9]|630)\\s*kcal"
    match: contains
