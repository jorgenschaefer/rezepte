schema_version: "1.0"
name: keine-punktlandung
description: >
  Absicherung, kein Beleg: Bei gerundeten Zutatenmengen ist ein Treffer auf die
  Kilokalorie Zufall; trifft er wiederholt, ist nicht vorwärts gerechnet
  worden. Ohne eine Zeile dazu blieb er in allen gemessenen Läufen aus.
tags: [naehrwerte]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: regex
    name: nicht-exakt-600
    weight: 1
    pattern: "Energie\\s*\\|\\s*600\\s*kcal"
    match: not_contains
