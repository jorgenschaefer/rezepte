schema_version: "1.0"
name: korridor-haelt-die-korrektur-aus
description: >
  Absicherung, kein Beleg: Der Koch sieht die Nährwerttabelle nicht und kennt
  das Kalorienziel nicht. Verlangt er mehr Öl oder eine größere Portion, rechnet
  der Skill die Tabelle zwar neu – ob die neue Zahl noch zum Auftrag passt,
  steht in keiner Zeile. Der Fall hält fest, dass die Energie die Überarbeitung
  trotzdem übersteht.

  Der Grader stellt nur sicher, dass geprüft wurde; was der Prüfer geändert hat,
  steht nicht in der Antwort, sondern nur im Verlauf. Gerechnet wird mit
  evals/pruefe-korridor-nach-korrektur.mjs, und zwar beide Fassungen: die Liste
  aus dem Prüfauftrag und die aus der Endantwort.

  „Curry" als Auftrag, weil der Koch dort Hebel hat, die wiegen – Öl, Erdnussmus,
  Reismenge. In den gemessenen Läufen mit diesem Wort hat die Prüfung jedes Mal
  Mengen geändert; ohne Mengenänderung misst der Fall nichts und meldet sich als
  „nicht anwendbar".

  Fünf Läufe aus demselben Grund wie bei tabelle-passt-zur-zutatenliste: Der
  Fall greift nur, wenn die Prüfung überhaupt Mengen anfasst.
tags: [naehrwerte, pruefer]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal Curry
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
runs: 5
graders:
  - type: tool_used
    name: pruefer-gelaufen
    weight: 1
    tool: Agent
    min: 1
