schema_version: "1.0"
name: zwei-listen-im-ordner
description: >
  Im Arbeitsverzeichnis liegt neben dem Vorrat eine zweite Zutatenliste:
  `vorrat-keller.md`, ein zweites Regal im selben Haushalt, haltbar und
  jederzeit verfügbar. Alle sechs Zutaten darin stehen in `zutaten.md`, keine
  in `vorratskammer.md` – wer sie nimmt, bricht also nicht ab, sondern kocht
  an der genannten Liste vorbei.

  Eine Einkaufsliste war als Falle zu schwach: „noch nicht eingeräumt" ist
  kein Vorrat, und der Skill ließ sie in neun von zehn Läufen auch ohne die
  Zeile stehen. Ein zweites Regal ist genauso verfügbar wie das erste – hier
  entscheidet nur noch, welche Datei die Zeile benennt.

  Der Fall nimmt der Umgebung ihren Hinweis: Solange `vorratskammer.md` die
  einzige Zutatenliste im Verzeichnis ist, hält sich der Skill von selbst
  daran, und die Zeile „Verwende ausschließlich Zutaten, die in
  `vorratskammer.md` stehen" lässt sich nicht messen. Mit zwei Listen muss die
  Zeile sagen, welche gilt.

  Der Grader sucht die Zutat mit einer Menge daneben, nicht das bloße Wort:
  Antworten nennen die zweite Liste gern im Vorspann, gerade um zu sagen, dass
  sie sie stehen lassen.
tags: [vorrat]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: regex
    name: nichts-aus-dem-zweiten-vorrat
    weight: 1
    pattern: "(?:\\d+\\s*(?:g|ml|Stück|Dose|Scheiben))[^\\n]{0,18}(?:Hähnchen|Tempeh|Champignon|Kichererbse|Aubergine|Feta)|(?:Hähnchen|Tempeh|Champignon|Kichererbse|Aubergine|Feta)[^\\n]{0,18}\\d+\\s*(?:g|ml|Stück)"
    match: not_contains
  - type: regex
    name: rezept-steht-da
    weight: 1
    pattern: "Energie\\s*\\|\\s*\\d{3}\\s*kcal"
    match: contains
