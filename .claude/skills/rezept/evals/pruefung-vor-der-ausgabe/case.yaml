schema_version: "1.0"
name: pruefung-vor-der-ausgabe
description: >
  Das Skript zu starten genügt nicht – seine Zahlen müssen auch im Rezept
  landen. In einem früheren Lauf rechnete das Skript 603 kcal nach, in der
  Tabelle standen 600: rund auf das Ziel zu, nicht auf das Ergebnis. Dieser
  Fall prüft die Schrittmengen; den Vergleich der Tabelle mit der Skriptausgabe
  macht evals/pruefe-tabelle.mjs deterministisch – ein Judge greift im Verlauf
  regelmäßig einen der verworfenen Entwurfsläufe und urteilt falsch.
tags: [naehrwerte]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: llm
    name: schrittmengen-summieren-sich
    weight: 1
    criteria: |
      Prüfe die Zubereitungsschritte gegen die Zutatenliste.

      Wird eine Zutat über mehrere Schritte verteilt, müssen die dort genannten
      Teilmengen zusammen genau die Menge aus der Zutatenliste ergeben – „5 g Rapsöl"
      und „die restlichen 5 g Rapsöl" bei 10 g in der Liste. Wird dieselbe Zutat in
      zwei Schritten nur weiterverarbeitet (schneiden, dann braten), ist die volle
      Menge in beiden Schritten richtig und kein Fehler.

      Durchgefallen, wenn Teilmengen sich zu mehr oder weniger als der Listenmenge
      addieren, oder wenn ein Schritt eine Zutat ohne Menge nennt („das restliche Öl").
