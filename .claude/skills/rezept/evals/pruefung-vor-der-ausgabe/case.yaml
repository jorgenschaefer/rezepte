schema_version: "1.0"
name: pruefung-vor-der-ausgabe
description: >
  Belegt die Zeile „Lass das fertige Rezept von einem Subagenten prüfen". Drei
  Grader: der Subagent läuft, das Kalorienziel hält den Umbau danach aus, und
  die Prüfung steht nicht in der Antwort. Gemessen: mit der Zeile 3 von 3, ohne
  sie 0 von 3 – ohne sie fragt niemand nach. Was der Prüfer findet, prüft der
  Fall nicht; das ist je Lauf ein anderes Rezept.
tags: [naehrwerte, format]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
runs: 3
graders:
  - type: tool_used
    name: subagent-gestartet
    weight: 1
    tool: Agent
    min: 1
  - type: regex
    name: energie-zwischen-570-und-630
    weight: 1
    pattern: "Energie\\s*\\|\\s*(5[7-9][0-9]|6[0-2][0-9]|630)\\s*kcal"
    match: contains
