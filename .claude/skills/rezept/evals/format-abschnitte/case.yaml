schema_version: "1.0"
name: format-abschnitte
description: >
  Prüft, dass jeder Abschnitt aus dem Format in der Antwort auftaucht. Ein
  Grader je Abschnitt, damit eine Ablation zeigt, welche Zeile ihren Abschnitt
  trägt und welchen das Modell ohnehin schreibt. Der Titel zählt in beiden
  Schreibweisen – als Label „Titel:" und als Überschrift mit dem Rezeptnamen
  direkt vor den Portionen.
tags: [format]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: regex
    name: titel
    weight: 1
    pattern: "(?:Titel|(?:^|\\n)(?:#{1,3} |\\*\\*)(?!Portionen|Zeit|Kochgeschirr|Nährwerte|Zutaten|Zubereitung)[^\\n]{3,80}\\n)[\\s\\S]{0,200}(?:Portionen|Zeit|Kochgeschirr|Nährwerte)"
    match: contains
  - type: regex
    name: portionen
    weight: 1
    pattern: "Portionen\\W{0,6}\\d"
    match: contains
  - type: regex
    name: zeit
    weight: 1
    pattern: "(?:^|\\n)(?:#{1,4} |- |\\*\\*)\\**Zeit"
    match: contains
  - type: regex
    name: kochgeschirr
    weight: 1
    pattern: "(?:^|\\n)(?:#{1,4} |- |\\*\\*)\\**Kochgeschirr"
    match: contains
  - type: regex
    name: naehrwerte
    weight: 1
    pattern: "(?:^|\\n)(?:#{1,4} |- |\\*\\*)\\**Nährwerte"
    match: contains
  - type: regex
    name: zutatenliste
    weight: 1
    pattern: "(?:^|\\n)(?:#{1,4} |- |\\*\\*)\\**Zutaten"
    match: contains
  - type: regex
    name: zubereitung
    weight: 1
    pattern: "(?:^|\\n)(?:#{1,4} |- |\\*\\*)\\**Zubereitung"
    match: contains
