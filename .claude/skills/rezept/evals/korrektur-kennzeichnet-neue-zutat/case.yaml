schema_version: "1.0"
name: korrektur-kennzeichnet-neue-zutat
description: >
  Belegt den Zusatz „Korrekturen, die eine neue Zutat brauchen, kennzeichne als
  optional". Ohne ihn schlug der Prüfer Kokosmilch vor, ohne dass die Antwort
  verriet, dass sie nicht im Haus ist. Der Grader hier stellt nur sicher, dass
  ein Prüfbericht vorliegt – die Quote selbst zählt evals/pruefe-kennzeichnung.mjs
  aus dem Verlauf, weil die Antwort des Prüfers gar nicht in der Ausgabe steht.
  Der Fall ergänzt pruefung-vor-der-ausgabe: der belegt, dass geprüft wird,
  dieser, was die Prüfung taugt.
tags: [vorrat]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
runs: 3
graders:
  - type: tool_used
    name: pruefbericht-liegt-vor
    weight: 1
    tool: Agent
    min: 1
