schema_version: "1.0"
name: kochgeschirr-parallel
description: >
  Prüft die beiden Hälften der Kochgeschirr-Zeile getrennt: die Liste der
  Gefäße und den Hinweis, was davon gleichzeitig auf dem Herd steht.
tags: [format]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal Reis mit angebratenem Tofu und Gemüse
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: llm
    name: geschirr-aufgezaehlt
    weight: 1
    criteria: |
      Bestanden, wenn das Rezept an einer Stelle aufzählt, welches
      Kochgeschirr man braucht (Topf, Pfanne, Blech, Schüssel, Sieb …).

      Durchgefallen, wenn man sich das Geschirr erst aus den
      Zubereitungsschritten zusammensuchen muss.
  - type: llm
    name: gleichzeitigkeit-vermerkt
    weight: 1
    criteria: |
      Bestanden, wenn dabei steht, was gleichzeitig läuft und was nacheinander
      – etwa „1 Topf und 1 Pfanne, parallel" oder „Pfanne erst nach dem Topf,
      1 Kochfeld reicht".

      Durchgefallen, wenn das Geschirr nur aufgezählt wird, ohne ein Wort zur
      Gleichzeitigkeit.
