schema_version: "1.0"
name: zutaten-mit-zustand
description: >
  Der Auftrag setzt Karotten und Zwiebeln, damit zwei Zutaten sicher in der
  Liste stehen, die man schneiden muss. Geprüft wird, ob die Zutatenliste zu
  beiden den Zustand nennt – „60 g Karotte, in dünnen Scheiben" statt „60 g
  Karotte". Die Schritte bleiben außen vor: Dass dort „in Scheiben schneiden"
  steht, sagt nichts über die Liste.
tags: [format]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal mit Karotten und Zwiebeln
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 3
graders:
  - type: llm
    name: zustand-bei-karotte-und-zwiebel
    weight: 1
    criteria: |
      Sieh dir nur die Zutatenliste an – die Aufzählung mit den Mengen, nicht
      die Zubereitungsschritte.

      Zwei Zutaten sind durch den Auftrag gesetzt: Karotte (oder Möhre) und
      Zwiebel. Für jede von beiden gilt: In derselben Zeile muss stehen, wie
      sie verarbeitet wird – „in dünnen Scheiben", „gewürfelt", „in Streifen",
      „geraspelt", „fein gehackt".

      Bestanden, wenn beide Zeilen eine solche Angabe tragen. Alle anderen
      Zutaten sind für diesen Fall egal.
