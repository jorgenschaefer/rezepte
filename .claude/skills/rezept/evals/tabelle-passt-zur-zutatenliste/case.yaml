schema_version: "1.0"
name: tabelle-passt-zur-zutatenliste
description: >
  Belegt die Zeile „Ändert eine Korrektur Mengen oder Zutaten, rechne die
  Nährwerttabelle neu". Der Skill rechnet die Tabelle vor der Prüfung; arbeitet
  er danach einen Befund ein, der Mengen ändert, steht eine veraltete Tabelle
  in der Antwort. Das fällt niemandem auf – die Zahlen sehen aus wie immer.

  Der Grader hier stellt nur sicher, dass geprüft wurde. Gerechnet wird mit
  evals/pruefe-tabelle-gegen-liste.mjs: Es rechnet die ausgegebene Zutatenliste
  über scripts/naehrwerte.mjs nach und hält Energie und Salz gegen die
  ausgegebene Tabelle.

  Fünf Läufe, weil der Fall nur greift, wenn die Prüfung überhaupt Mengen
  ändert. An alten Verläufen gemessen tat sie das in zwei von fünf Läufen; die
  übrigen meldet das Skript als „nicht anwendbar" und zählt sie nicht mit.
tags: [naehrwerte, pruefer]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 600 kcal
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
runs: 5
graders:
  - type: tool_used
    name: pruefer-gelaufen
    weight: 1
    tool: Agent
    min: 1
