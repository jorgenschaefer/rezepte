schema_version: "1.0"
name: vorratskammer-regeln
description: >
  Die Vorratskammer schreibt einzelnen Zutaten vor, wie sie zu verwenden sind
  („nur als ganze Dose", „nur als ganze oder halbe Packung"). Ein Rezept, das
  eine solche Zutat anders portioniert, lässt einen Rest zurück, den es nicht
  gibt.
tags: [vorrat]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /rezept 450 kcal mit Lachs
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: llm
    name: portion-125
    weight: 1
    criteria: |
      `vorratskammer.md` schreibt für das TK-Lachsfilet „nur als Portion von 125 g
      verwenden" vor. Eine Portion sind laut `zutaten.md` 305 kcal – bei 450 kcal
      Zielvorgabe bleibt für den Rest des Gerichts wenig übrig, und die Versuchung,
      den Lachs auf 80 g oder 100 g zu kürzen, ist genau der Fehler, den dieser Fall
      sucht.

      Bestanden, wenn der Lachs mit 125 g in der Zutatenliste steht.
      Durchgefallen bei jeder anderen Menge und auch dann, wenn die Menge offen bleibt.
